<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>閱讀與自然拼讀—前測｜報名與測驗</title>
<style>
:root{--bg:#f6f3ec;--ink:#22303c;--muted:#6b7780;--card:#fff;--line:#d9d3c5;--accent:#2f6fb0;--accent-ink:#fff;--ok:#2e8b57;--warn:#c0392b;--soft:#e9eff6;--sel:#ffd24a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{max-width:860px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column}
h1{font-size:1.45rem;margin:.2em 0;line-height:1.35}
h2{font-size:1.15rem;margin:1.2em 0 .4em}
p{line-height:1.6}
.muted{color:var(--muted);font-size:.9rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:12px 0}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px 22px;font-size:1.1rem;font-weight:600}
.btn.sec{background:var(--soft);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:6px 0}
#token{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;width:100%;max-width:240px;text-transform:uppercase}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.x{background:none;border:0;color:var(--muted);font-size:1.3rem;padding:6px 10px}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;user-select:none;-webkit-user-select:none}
.play{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:2.6rem;display:flex;align-items:center;justify-content:center;flex:none}
.play.on{animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:scale(1.08);background:#4a8ed6}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(560px,100%,calc(100vh - 230px));min-width:240px}
.card{aspect-ratio:1/1;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.card img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.card .ph{padding:10px;text-align:center;font-size:1.2rem;color:var(--ink);line-height:1.4}
.card .ph small{display:block;color:var(--muted);font-size:.7rem;margin-top:6px}
.card:disabled{opacity:.55}
.card.sel{border-color:var(--sel);box-shadow:0 0 0 4px var(--sel)}
.card.right{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok);opacity:1}
.card.wrong{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pair{display:flex;gap:28px;font-size:3rem}
.pair span{width:84px;height:84px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;opacity:.35}
.pair span.on{opacity:1;background:var(--sel)}
.sd{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:560px}
.sd button{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:22px 8px;font-size:1.3rem;font-weight:600;color:var(--ink)}
.sd button b{display:block;font-size:2.6rem;letter-spacing:6px;margin-bottom:6px}
.sd button:disabled{opacity:.55}
.sd button.sel{border-color:var(--sel);box-shadow:0 0 0 4px var(--sel)}
.sd button.right{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok);opacity:1}
.sd button.wrong{animation:shake .3s}
.dbg{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;color:var(--muted);min-height:1.2em;text-align:center}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.85rem;font-weight:600}
.tag.ok{background:#dff3e6;color:var(--ok)}
.tag.no{background:#fbe3df;color:var(--warn)}
.note{border-left:6px solid var(--warn);background:#fbe3df;border-radius:8px;padding:10px 14px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.verdict{border-left:6px solid var(--accent);padding:10px 14px;background:var(--soft);border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.big{font-size:3.4rem;text-align:center}
.tag.mid{background:#fdf0cf;color:#8a6200}
.tag.chk{background:#eceae4;color:var(--muted)}
.grp{margin:14px 0 4px;font-weight:600}
.grp small{display:block;font-weight:400;color:var(--muted);font-size:.85rem;margin-top:2px}
.st{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:0}
.st .nm small{display:block;color:var(--muted);font-size:.82rem}
.st .ct{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.st .meter{grid-column:1/-1;position:relative;height:12px;background:#ebe7dc;border-radius:6px}
.st .meter i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.st .meter u{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.explain p{margin:.5em 0}
form label{display:block;margin:12px 0 4px;font-weight:600}
form input[type=text],form input[type=email],form select{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;width:100%;max-width:360px;background:#fff;text-transform:none}
form .chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:12px 0 0;line-height:1.5}
form .chk input{margin-top:5px;flex:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
ol.steps{padding-left:1.3em;line-height:1.8;margin:.4em 0}
ol.nextSteps li{margin:.35em 0}
#booking{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
#booking p{margin:0 0 10px}
.cta{text-align:center}
.cta a{display:inline-block;text-decoration:none}
details summary{cursor:pointer;color:var(--accent)}
.explain ul{margin:.3em 0 .6em;padding-left:1.2em;line-height:1.6}
.err{color:var(--warn)}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="data/items.js"></script>
<script>
(function(){
"use strict";
const CFG = Object.assign({SHEET_API:"", ALLOW_INCOMPLETE_ASSETS:false, REGISTRATION_OPEN:false, BOOKING_URL:"", CONTACT_EMAIL:"", imageDir:"assets/images/", audioDir:"assets/audio/", wordRate:0.85, sentenceRate:0.85}, window.GATE_CONFIG||{});
const SHEET = String(CFG.SHEET_API==null?"":CFG.SHEET_API).trim();
const API = /^https?:\/\//.test(SHEET) ? SHEET : "";
/* 設定有問題時，說明是哪一種問題（給管理者看） */
function configProblem(){
  if(!window.GATE_CONFIG) return "config.js 沒有載入成功。可能是檔案沒有上傳到 site 資料夾，或檔案裡有語法錯誤（例如引號被改成全形或彎引號、少了逗號）。";
  if(!SHEET || /PASTE_YOUR/.test(SHEET)) return "config.js 的 SHEET_API 還是預設的佔位文字。網站上的 config.js 可能不是你改過的那一份。";
  if(!API) return "config.js 的 SHEET_API 不是 https:// 開頭的網址。";
  return "";
}
const adminHint = () => el("p",{class:"muted",id:"adminHint"}, "給管理者：", configProblem(), " 在網址後面加上 ?check=1 可以看到完整的設定檢查。");
const G = window.GATE, app = document.getElementById("app");
const qs = new URLSearchParams(location.search);
const LOCAL = location.protocol==="file:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const FAST = LOCAL && qs.get("fast")==="1";
const TOKEN_Q = (qs.get("t")||"").trim().toUpperCase();     // 信裡的專屬連結帶著代碼
const DEMO_OK = LOCAL || qs.get("demo")==="1";              // 試用版不對外公開，只有加 ?demo=1 才看得到
const REG_OPEN = CFG.REGISTRATION_OPEN===true || qs.get("preview")==="1";       // 只在本機測試時可用：縮短等待時間
const TITLE = "閱讀與自然拼讀—前測";
const ZH = { A:"聽聽看，點出你聽到的圖片。", B:"你會聽到兩個聲音。一樣，就按一樣。不一樣，就按不一樣。", C:"聽一句話，點出對的圖片。" };
const RESUME_HOURS = 12;

const S = { mode:null, token:"", name:"", debug:false, startedAt:null, plan:null, idx:0, responses:[], practiceErrors:{A:0,B:0,C:0}, assets:"complete", missing:{img:0,aud:0} };
const ITEM = {}; ["A","A_practice","B","B_practice","C","C_practice"].forEach(k => G[k].forEach(it => ITEM[it.id]=it));
const TOTAL = G.A.length + G.B.length + G.C.length;

const wait = ms => new Promise(r => setTimeout(r, FAST ? Math.min(ms, 30) : ms));
const el = (tag, attrs={}, ...kids) => { const e=document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) { if (k==="class") e.className=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v!==false && v!=null) e.setAttribute(k, v===true?"":v); }
  for (const k of kids.flat()) if (k!=null && k!==false) e.append(k.nodeType?k:document.createTextNode(k)); return e; };
const mount = (...nodes) => app.replaceChildren(...nodes.filter(Boolean));   // 略過 null，避免畫面出現「null」
const shuffle = a => { a=a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const timeout = ms => (typeof AbortSignal!=="undefined" && AbortSignal.timeout) ? AbortSignal.timeout(ms) : undefined;

/* ---------- 後端（Google 試算表 + Apps Script） ---------- */
async function apiGet(params, ms){ const r = await fetch(API+"?"+new URLSearchParams(params), {signal:timeout(ms||15000)}); return r.json(); }
async function apiPost(body, ms){ const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body), signal:timeout(ms||30000)}); return r.json(); }

/* ---------- 聲音：錄音檔用 Web Audio 播放；試用版缺檔時改用瀏覽器語音 ---------- */
let ctx=null, currentSrc=null; const buffers=new Map();
function ensureCtx(){ const AC=window.AudioContext||window.webkitAudioContext; if(!ctx && AC){ try{ ctx=new AC(); }catch(e){} } if(ctx && ctx.state==="suspended") ctx.resume(); }
const silentClips = new Set();      // 檔案存在、但幾乎沒有聲音的錄音（語音合成偶爾會產生）
async function loadClip(key){
  if (buffers.has(key)) return buffers.get(key);
  let buf=null;
  if (ctx && location.protocol!=="file:") { try { const r=await fetch(CFG.audioDir+key+".mp3");
    if (r.ok && !/text\/html/.test(r.headers.get("content-type")||"")) { const ab=await r.arrayBuffer(); buf=await new Promise((res,rej)=>ctx.decodeAudioData(ab,res,rej)); } } catch(e){ buf=null; } }
  if (buf) { const d=buf.getChannelData(0); let peak=0; for(let i=0;i<d.length;i+=4){ const v=Math.abs(d[i]); if(v>peak) peak=v; }
    if (peak<0.02) { silentClips.add(key); buf=null; } }          // 沒有聲音的檔案當成缺檔
  buffers.set(key, buf); return buf;
}
/* 確保音訊引擎在運作。iPad／iPhone 在切換 App、鎖定螢幕或來電後，會把它暫停 */
async function ensureRunning(){
  if (!ctx) return false;
  if (ctx.state!=="running") { try { await Promise.race([ctx.resume(), new Promise(r=>setTimeout(r,1500))]); } catch(e){} }
  return ctx.state==="running";
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && ctx && ctx.state!=="running") ctx.resume().catch(()=>{}); });
let currentEl=null;
function playBuffer(buf){ return new Promise(res => { let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
  const s=ctx.createBufferSource(); s.buffer=buf; s.connect(ctx.destination); s.onended=fin; currentSrc=s; s.start(); setTimeout(fin, buf.duration*1000+500); }); }
/* 音訊引擎恢復不了時，改用一般的音訊元件播放同一個檔案 */
function playElement(url){ return new Promise(res => { let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
  const a=new Audio(url); currentEl=a; a.onended=fin; a.onerror=fin; const p=a.play(); if(p&&p.catch) p.catch(fin); setTimeout(fin, 8000); }); }
function tts(text, lang, rate){
  return new Promise(res => {
    if (!("speechSynthesis" in window)) { res(false); return; }
    const u = new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=rate||1;
    const vs = speechSynthesis.getVoices(); const v = vs.find(v=>v.lang===lang) || vs.find(v=>v.lang.slice(0,2)===lang.slice(0,2)); if (v) u.voice=v;
    let done=false; const fin=()=>{ if(!done){ done=true; clearTimeout(t); res(true); } };
    u.onend=fin; u.onerror=fin; const t=setTimeout(fin, FAST ? 30 : 1800+text.length*110);
    try { speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){ fin(); }
  });
}
async function playClip(key, text, lang, rate, altKey){
  let used=key, buf = await loadClip(key); if (!buf && altKey) { buf = await loadClip(altKey); used=altKey; }
  if (buf) { if (await ensureRunning()) return playBuffer(buf); return playElement(CFG.audioDir+used+".mp3"); }
  return tts(text, lang, rate);
}
if (LOCAL) window.__gateAudio = () => ({ ctx, silent:[...silentClips] });   // 只在本機測試時使用
function stopSound(){ try{ currentSrc && currentSrc.stop(); }catch(e){} try{ currentEl && currentEl.pause(); }catch(e){} try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){} }
const sayWord = (w, take) => take===2 ? playClip("w_"+w+"_2", w, "en-US", CFG.wordRate, "w_"+w) : playClip("w_"+w, w, "en-US", CFG.wordRate);
const saySentence = it => playClip(it.id.toLowerCase(), it.sentence, "en-US", CFG.sentenceRate);

/* ---------- 素材清單與預載 ---------- */
function requiredImages(){ const s=new Set();
  G.A_practice.concat(G.A).forEach(it=>it.options.forEach(o=>s.add("w_"+o.w)));
  G.C_practice.concat(G.C).forEach(it=>it.options.forEach(o=>s.add(o.img))); return [...s]; }
function requiredAudio(){ const s=new Set();
  G.A_practice.concat(G.A).forEach(it=>s.add("w_"+it.target));
  G.B_practice.concat(G.B).forEach(it=>{ s.add("w_"+it.w1); s.add("w_"+it.w2); if(it.answer==="same") s.add("w_"+it.w1+"_2"); });
  G.C_practice.concat(G.C).forEach(it=>s.add(it.id.toLowerCase()));
  ["inst_a","inst_b","inst_c"].forEach(k=>s.add(k)); return [...s]; }
const missingImg = new Set();
const probeImage = f => new Promise(res => { const i=new Image(); i.onload=()=>res(true); i.onerror=()=>res(false); i.src=CFG.imageDir+f+".jpg"; });
async function pool(list, n, fn, tick){ let i=0, done=0; await Promise.all(Array.from({length:n}, async()=>{ while(i<list.length){ const x=list[i++]; await fn(x); tick(++done); } })); }
async function preflight(){
  ensureCtx();
  const imgs=requiredImages(), auds=requiredAudio(), total=imgs.length+auds.length; let n=0;
  const bar=el("i"), label=el("p",{class:"muted",id:"loading"},"準備中…");
  mount(el("h1",{},TITLE), el("div",{class:"panel"}, label, el("div",{class:"bar"},bar)));
  const tick=()=>{ n++; bar.style.width=Math.round(100*n/total)+"%"; label.textContent=`準備中… ${n} / ${total}`; };
  missingImg.clear(); let missAud=0;
  await pool(imgs, 8, async f=>{ if(!(await probeImage(f))) missingImg.add(f); }, tick);
  await pool(auds, 6, async k=>{ if(!(await loadClip(k))) missAud++; }, tick);
  S.missing={img:missingImg.size, aud:missAud, silent:[...silentClips]}; S.assets=(missingImg.size||missAud)?"incomplete":"complete";
}

/* ---------- 圖片 ---------- */
function picture(file, label, sub){
  if (missingImg.has(file)) return el("div",{class:"ph"}, label, sub?el("small",{},sub):null);
  return el("img",{src:CFG.imageDir+file+".jpg",alt:"",draggable:"false"});
}

/* ---------- 畫面骨架 ---------- */
let runId=0, resumeFn=null;
const doneCount = () => S.responses.length;
function frame(...content){
  mount(
    el("div",{class:"top"}, el("div",{class:"bar"}, el("i",{style:`width:${Math.round(100*doneCount()/TOTAL)}%`})),
      el("button",{class:"x",title:"暫停",onclick:pauseDialog},"✕")),
    el("div",{class:"stage"}, ...content));
}
function pauseDialog(){
  stopSound();
  const roster = S.mode==="roster";
  mount(el("div",{class:"panel"}, el("h2",{},"要暫停嗎？"),
    el("p",{class:"muted"}, roster ? `已完成 ${doneCount()} / ${TOTAL} 題。暫停後，${RESUME_HOURS} 小時內用同一台裝置可以從這裡繼續。` : "試用版暫停後不會保留進度。"),
    el("div",{class:"row"}, el("button",{class:"btn",id:"resume",onclick:()=>{ resumeFn && resumeFn(); }},"繼續作答"),
      el("button",{class:"btn sec",id:"pause",onclick:()=>{ runId++; if(!roster) store.del("gate-progress"); start(); }}, roster?"暫停，回到開始畫面":"結束試用"))));
}

/* ---------- 四選一題（A、C 共用） ---------- */
const ERR = { A:{phon:"音近",sem:"義近",unrel:"無關"}, C:{subject:"主詞",verb:"動作屬性",object:"地點受詞"} };
function choiceTrial(it, kind, practice){
  const my=runId;
  return new Promise(resolve => {
    const opts=shuffle(it.options); let replays=0, t0=0, locked=true, wrongs=0, answered=false;
    const playBtn=el("button",{class:"play",title:"再聽一次"},"🔊");
    const dbg=el("div",{class:"dbg"}, S.debug ? (kind==="A"?it.target:it.sentence) : "");
    const cards=opts.map(o=>{ const file=kind==="A"?"w_"+o.w:o.img, label=kind==="A"?o.w:o.desc;
      const c=el("button",{class:"card",disabled:true,"data-key":file,"data-role":S.debug?o.role:null}, picture(file,label,S.debug?o.role:null));
      c.addEventListener("click",()=>pick(o,c)); return c; });
    const setLock=v=>{ locked=v; cards.forEach(c=>c.disabled=v); playBtn.disabled=v; };
    async function play(){ if(my!==runId||answered) return; setLock(true); playBtn.classList.add("on");
      await (kind==="A"?sayWord(it.target):saySentence(it)); if(my!==runId) return;
      playBtn.classList.remove("on"); setLock(false); t0=performance.now(); }
    playBtn.addEventListener("click",()=>{ if(!locked){ replays++; play(); } });
    async function pick(o,c){
      if(locked||answered||my!==runId) return; const rt=Math.round(performance.now()-t0); setLock(true);
      const correct=o.role==="target";
      if(practice){
        if(correct){ c.classList.add("right"); await wait(700); resolve(); return; }
        S.practiceErrors[kind]++; wrongs++; c.classList.add("wrong"); await wait(500); c.classList.remove("wrong");
        if(wrongs>=2){ cards[opts.findIndex(x=>x.role==="target")].classList.add("right"); await wait(1500); resolve(); }
        else play();
        return;
      }
      answered=true; c.classList.add("sel");
      S.responses.push({ item_id:it.id, subtest:kind==="A"?(it.group==="control"?"A_ctrl":"A_stage1"):"C",
        stimulus:kind==="A"?it.target:it.sentence, response:kind==="A"?o.w:o.desc, correct:correct?1:0,
        error_type:correct?"":ERR[kind][o.role], rt_ms:rt, replays, tag:kind==="A"?(it.pos||""):"L"+it.level });
      await wait(450); resolve();
    }
    resumeFn=()=>{ frame(playBtn, dbg, el("div",{class:"grid","data-item":it.id}, cards)); if(locked) wait(350).then(play); };
    resumeFn();
  });
}

/* ---------- 一樣／不一樣題（B） ---------- */
function sameDiffTrial(it, practice, flip){
  const my=runId;
  return new Promise(resolve => {
    const w1=flip?it.w2:it.w1, w2=flip?it.w1:it.w2; let replays=0, t0=0, locked=true, wrongs=0, answered=false;
    const d1=el("span",{},"🔊"), d2=el("span",{},"🔊");
    const playBtn=el("button",{class:"btn sec"},"再聽一次");
    const dbg=el("div",{class:"dbg"}, S.debug?`${w1} – ${w2}`:"");
    const bSame=el("button",{disabled:true,"data-ans":"same"}, el("b",{},"●●"),"一樣");
    const bDiff=el("button",{disabled:true,"data-ans":"diff"}, el("b",{},"●▲"),"不一樣");
    const setLock=v=>{ locked=v; bSame.disabled=v; bDiff.disabled=v; playBtn.disabled=v; };
    async function play(){ if(my!==runId||answered) return; setLock(true);
      d1.classList.add("on"); await sayWord(w1,1); d1.classList.remove("on"); if(my!==runId) return; await wait(600);
      d2.classList.add("on"); await sayWord(w2, it.answer==="same"?2:1); d2.classList.remove("on"); if(my!==runId) return;
      setLock(false); t0=performance.now(); }
    playBtn.addEventListener("click",()=>{ if(!locked){ replays++; play(); } });
    async function pick(ans,b){
      if(locked||answered||my!==runId) return; const rt=Math.round(performance.now()-t0); setLock(true);
      const correct=ans===it.answer;
      if(practice){
        if(correct){ b.classList.add("right"); await wait(700); resolve(); return; }
        S.practiceErrors.B++; wrongs++; b.classList.add("wrong"); await wait(500); b.classList.remove("wrong");
        if(wrongs>=2){ (it.answer==="same"?bSame:bDiff).classList.add("right"); await wait(1500); resolve(); }
        else play();
        return;
      }
      answered=true; b.classList.add("sel");
      S.responses.push({ item_id:it.id, subtest:it.answer==="diff"?"B_diff":"B_same", stimulus:`${w1} – ${w2}`,
        response:ans==="same"?"一樣":"不一樣", correct:correct?1:0, error_type:correct?"":(it.answer==="diff"?"漏報":"誤報"),
        rt_ms:rt, replays, tag:it.cat||"相同" });
      await wait(450); resolve();
    }
    bSame.addEventListener("click",()=>pick("same",bSame)); bDiff.addEventListener("click",()=>pick("diff",bDiff));
    resumeFn=()=>{ frame(el("div",{class:"pair","data-item":it.id}, d1, d2), dbg, el("div",{class:"sd"}, bSame, bDiff), playBtn); if(locked) wait(350).then(play); };
    resumeFn();
  });
}

  C:{icon:"👂 🖼️🖼️", lines:["第三部分：聽一句話，點出對的圖。","先練習一題。"]} };
const STARS = {A:"⭐",B:"⭐⭐",C:"⭐⭐⭐"};
function gate(part, isGo){
  const my=runId;
  return new Promise(resolve => {
    let left=false;
    const speak=()=>{ if(my===runId && !left) playClip("inst_"+part.toLowerCase(), ZH[part], "zh-TW", 1); };
    resumeFn=()=>frame(el("div",{class:"panel",style:"width:100%;max-width:560px;text-align:center"},
      el("div",{class:"big"}, isGo?STARS[part]:INTRO[part].icon),
      ...(isGo?["練習完成，開始正式題。"]:INTRO[part].lines).map(l=>el("p",{},l)),
      el("div",{class:"row",style:"justify-content:center"},
        isGo?null:el("button",{class:"btn sec",onclick:speak},"🔊 聽說明"),
        el("button",{class:"btn","data-go":"1",onclick:()=>{ left=true; stopSound(); resolve(); }},"開始"))));
    resumeFn(); if(!isGo) wait(300).then(speak);
  });
}

/* ---------- 流程 ---------- */
function orderB(items){ for(let k=0;k<200;k++){ const a=shuffle(items); let run=1, ok=true;
    for(let i=1;i<a.length;i++){ run=a[i].answer===a[i-1].answer?run+1:1; if(run>3){ ok=false; break; } } if(ok) return a; } return shuffle(items); }
function buildPlan(){
  const ctrl=shuffle(G.A.filter(i=>i.group==="control")), st=G.A.filter(i=>i.group==="stage1");
  const A=ctrl.slice(0,2).concat(shuffle(st.concat(ctrl.slice(2))));      // 前兩題用對照詞暖身
  const B=orderB(G.B), C=[1,2,3].flatMap(l=>shuffle(G.C.filter(i=>i.level===l)));
  const flip=it=>it.answer==="diff"&&Math.random()<0.5?1:0;
  return [].concat(
    [{k:"intro",part:"A"}], G.A_practice.map(i=>({k:"A",id:i.id,p:1})), [{k:"go",part:"A"}], A.map(i=>({k:"A",id:i.id})),
    [{k:"intro",part:"B"}], G.B_practice.map(i=>({k:"B",id:i.id,p:1,f:flip(i)})), [{k:"go",part:"B"}], B.map(i=>({k:"B",id:i.id,f:flip(i)})),
    [{k:"intro",part:"C"}], G.C_practice.map(i=>({k:"C",id:i.id,p:1})), [{k:"go",part:"C"}], C.map(i=>({k:"C",id:i.id})));
}
function persist(){ if(S.mode!=="roster") return;
  store.set("gate-progress",{v:G.version, token:S.token, name:S.name, startedAt:S.startedAt, plan:S.plan, idx:S.idx, responses:S.responses, practiceErrors:S.practiceErrors, savedAt:Date.now()}); }
async function run(){
  const my=++runId;
  persist();
  while(S.idx<S.plan.length){
    const st=S.plan[S.idx], it=ITEM[st.id];
    if(st.k==="intro") await gate(st.part,false); else if(st.k==="go") await gate(st.part,true);
    else if(st.k==="B") await sameDiffTrial(it, !!st.p, !!st.f); else await choiceTrial(it, st.k, !!st.p);
    if(my!==runId) return;
    S.idx++; persist();          // 每完成一步就存檔，重新整理或暫停後可以從下一步繼續
  }
  finish();
}
function begin(){ if(S.mode==="roster"&&API) apiPost({action:"start",token:S.token}).catch(()=>{});
  S.startedAt=new Date().toISOString(); S.plan=buildPlan(); S.idx=0; S.responses=[]; S.practiceErrors={A:0,B:0,C:0}; run(); }

/* ---------- 計分與判讀 ---------- */
function PARTDEF(){ const T=G.thresholds; return [
  {key:"A_stage1",name:"A 詞彙：第一階段詞",total:24,need:T.A1}, {key:"A_ctrl",name:"A 詞彙：對照詞",total:8,need:T.CTRL},
  {key:"B_diff",name:"B 音韻區辨：「不同」題",total:16,need:T.B_DIFF}, {key:"B_same",name:"B 音韻區辨：「相同」題",total:8,need:T.B_SAME},
  {key:"C",name:"C 句子理解",total:18,need:T.C} ]; }
/* 「接近」：未達門檻，但差距在 2 題以內（8 題的題型為 1 題以內），視為測驗誤差範圍 */
function mkParts(counts, answered){ return PARTDEF().map(p=>{ const c=counts[p.key]||0, full=!answered||answered[p.key]===p.total, pass=full&&c>=p.need;
  return {...p, correct:c, pass, near:!pass&&full&&c>=p.need-(p.total>=16?2:1)}; }); }
/* 由試算表存的結果重畫結果頁 */
function storedScore(r){ const parts=mkParts(r.counts,null), P=Object.fromEntries(parts.map(p=>[p.key,p]));
  let code=r.code; if(!PARENT[code]) code=!P.A_ctrl.pass?"ctrl":!P.A_stage1.pass?"vocab":!(P.B_diff.pass&&P.B_same.pass)?(P.B_diff.pass?"bias":"disc"):!P.C.pass?"sent":"ready";
  return {parts, code, borderline:r.borderline===true, profile:r.profile||""}; }
function score(){
  const by=k=>S.responses.filter(r=>r.subtest===k), sum=a=>a.reduce((n,r)=>n+r.correct,0), T=G.thresholds;
  const counts={}, answered={}; PARTDEF().forEach(p=>{ const rs=by(p.key); counts[p.key]=sum(rs); answered[p.key]=rs.length; });
  const parts=mkParts(counts, answered);
  const P=Object.fromEntries(parts.map(p=>[p.key,p]));
  const aErr=by("A_stage1").filter(r=>!r.correct), phon=aErr.filter(r=>r.error_type==="音近").length;
  const A=P.A_stage1.pass, B=P.B_diff.pass&&P.B_same.pass, C=P.C.pass;
  let profile, reading, action, code, deciding;
  if(!P.A_ctrl.pass){ code="ctrl"; deciding=["A_ctrl"]; profile="對照詞未達標"; reading="一般口語詞彙不足，或孩子不理解作答方式；結果不採計。"; action="繼續累積輸入，之後重測。"; }
  else if(!A&&phon*2>=aErr.length){ code="phon"; deciding=["A_stage1"]; profile="第一階段詞未達標，錯誤多為音近干擾"; reading="認得長詞但分不清短詞，詞彙表徵仍是整體輪廓。"; action="先做最小對比詞的聽辨與口語活動，再進 Phonics。"; }
  else if(!A){ code="vocab"; deciding=["A_stage1"]; profile="第一階段詞未達標，錯誤多為義近或無關"; reading="不認識這批詞。"; action="各單元先用聽和圖預教目標詞，再進解碼。"; }
  else if(!B){ code=P.B_diff.pass?"bias":"disc"; deciding=["B_diff","B_same"].filter(k=>!P[k].pass); profile="A 達標；B 未達標"; reading="認得詞，但聽不出特定音的差別。"; action="依未通過的對比類別做聽辨訓練；Phonics 可同步開始。"; }
  else if(!C){ code="sent"; deciding=["C"]; profile="A、B 達標；C 未達標"; reading="單詞層級足夠，句子理解不足。"; action="可進 Phonics，同時維持大量聽力輸入。"; }
  else { code="ready"; deciding=[]; profile="全部達標"; reading="達到入門門檻。"; action="直接進 Phonics。"; }
  const group=(rows,f)=>{ const m={}; rows.forEach(r=>{ const k=f(r); (m[k]=m[k]||{n:0,c:0}); m[k].n++; m[k].c+=r.correct; }); return m; };
  const count=(rows,f)=>{ const m={}; rows.forEach(r=>{ const k=f(r); m[k]=(m[k]||0)+1; }); return m; };
  const borderline = deciding.length>0 && deciding.every(k=>P[k].near);
  return { parts, profile, reading, action, code, borderline, aErrTypes:count(aErr,r=>r.error_type), aByPos:group(by("A_stage1"),r=>r.tag),
    bByCat:group(by("B_diff"),r=>r.tag), cByLevel:group(by("C"),r=>r.tag), cErrTypes:count(by("C").filter(r=>!r.correct),r=>r.error_type) };
}
function csv(){
  const head=["token","attempt_at","item_id","subtest","stimulus","response","correct","error_type","rt_ms","replays","tag"];
  const esc=v=>{ v=String(v??""); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  return "﻿"+[head.join(",")].concat(S.responses.map(r=>[S.token,S.startedAt,r.item_id,r.subtest,r.stimulus,r.response,r.correct,r.error_type,r.rt_ms,r.replays,r.tag].map(esc).join(","))).join("\n");
}

/* ---------- 成績送出：送不出去的會留在這台裝置，之後自動重送 ---------- */
async function flush(){
  let q=store.get("gate-pending")||[]; if(!q.length||!API) return {left:q.length, error:""};
  const keep=[]; let error="";
  let refused="";
  for(const p of q){ try{ const j=await apiPost(p);
      if(j.ok) continue;
      if(j.error==="already_taken"||j.error==="token_not_found"){ refused=j.error; continue; }     // 不會再成功，不保留
      keep.push(p); error=j.error||"unknown"; }catch(e){ keep.push(p); error="network"; } }
  if(keep.length) store.set("gate-pending",keep); else store.del("gate-pending");
  return {left:keep.length, error, refused};
}

function finish(){
  const sc=score();

    q.push({ action:"save", attempt_id:S.token+"|"+S.startedAt, token:S.token, attempt_at:S.startedAt, finished_at:new Date().toISOString(),
      duration_s:Math.round((Date.now()-new Date(S.startedAt))/1000), profile:sc.profile, result_code:sc.code, borderline:sc.borderline, practice_errors:S.practiceErrors, assets:S.assets,
      version:G.version, ua:navigator.userAgent.slice(0,160), responses:S.responses });
    store.set("gate-pending",q); store.del("gate-progress");
  }
  showResult(sc);
}

async function openToken(t){
  runId++; stopSound(); S.mode=null;
  mount(el("h1",{},TITLE), el("div",{class:"panel"}, el("p",{class:"muted",id:"loading"},"讀取中…")));
  const fail = (text, retry) => mount(el("h1",{},TITLE), el("div",{class:"panel"}, el("p",{class:"note",id:"linkError"}, text),
    el("div",{class:"row"}, retry?el("button",{class:"btn",onclick:()=>openToken(t)},"再試一次"):null, el("a",{class:"btn sec",href:location.pathname},"回到報名頁")), el("p",{class:"muted"}, contactLine())));
  if(!API){ fail("網站還沒有完成設定，暫時無法使用。"); app.append(adminHint()); return; }
  let j;
  try{
    if((store.get("gate-pending")||[]).some(p=>p.token===t)) await flush();          // 上次沒送出的成績，先補送
    j=await apiGet({action:"lookup",token:t});
  }catch(e){ fail("目前連不上伺服器，請檢查網路後再試一次。", true); return; }
  if(!j.ok){ fail("這個連結無效。請確認是從報名後收到的信裡點進來的。"); return; }
  S.token=t; S.name=j.name||""; store.set("gate-token",{t, name:S.name});
  if((store.get("gate-pending")||[]).some(p=>p.token===t)){
    mount(el("h1",{},TITLE), el("div",{class:"panel"}, el("p",{class:"note",id:"unsent"},`${S.name} 已經完成測驗，但成績還沒送出。請確認網路正常後再送一次。`),
      el("button",{class:"btn",id:"resend",onclick:()=>openToken(t)},"再送一次")));
    return;
  }
  if(j.result && !j.can_take){ S.mode="roster"; showResult(storedScore(j.result), j.result); return; }
  let saved=store.get("gate-progress");
  if(saved && (saved.token!==t || saved.v!==G.version || Date.now()-saved.savedAt>RESUME_HOURS*3600e3)){ store.del("gate-progress"); saved=null; }
  mount(
    el("h1",{},TITLE),
    saved ? el("div",{class:"panel",id:"resumeBox"}, el("p",{}, el("b",{id:"who"},S.name), `　有一份還沒做完的測驗（已完成 ${saved.responses.length} / ${TOTAL} 題）。`),
        el("button",{class:"btn",id:"continue",onclick:()=>enter("roster",saved)},"從上次的地方繼續"))
      : el("div",{class:"panel",id:"ready"}, el("p",{}, el("b",{id:"who"},S.name), " 的測驗　約 12 分鐘", j.result?el("span",{class:"muted"},"　（已開放重測）"):null),
        el("button",{class:"btn",id:"start",onclick:()=>enter("roster")},"開始測驗")),
    el("div",{class:"panel"}, el("h2",{style:"margin-top:0"},"給陪同的大人"), el("ul",{style:"line-height:1.7;padding-left:1.2em;margin:0"}, ADULT.map(x=>el("li",{},x)))),
    el("p",{class:"muted"}, contactLine()));
}

  if("speechSynthesis" in window) speechSynthesis.getVoices();
}
/* ---------- 設定檢查：網址加上 ?check=1 ---------- */
async function checkScreen(){
  const list=el("div",{id:"checks"});
  const add=(state,title,detail)=>{ const mark={ok:"✅",bad:"❌",warn:"⚠️",info:"ℹ️"}[state];
    list.append(el("div",{class:"st","data-state":state}, el("div",{class:"nm"}, `${mark} ${title}`, detail?el("small",{style:"font-size:.9rem;line-height:1.6"},detail):null))); };
  mount(el("h1",{},"設定檢查"), el("p",{class:"muted"},"這一頁給管理者用，逐項檢查網站和後端的設定。修正後重新整理就會再檢查一次。"), el("div",{class:"panel"}, list),
    el("p",{}, el("a",{href:location.pathname},"回到首頁")));
  // 1 config.js
  if(!window.GATE_CONFIG){ add("bad","config.js 沒有載入","檔案沒有上傳到 site 資料夾，或檔案裡有語法錯誤。最常見的是引號被文字編輯器改成彎引號（“ ”）或全形引號，或是少了行尾的逗號。請在瀏覽器直接打開「網站網址/config.js」看看內容。"); return; }
  add("ok","config.js 已載入");
  // 2 SHEET_API
  if(!SHEET || /PASTE_YOUR/.test(SHEET)){ add("bad","SHEET_API 還沒有填","網站上的 config.js 仍是預設的佔位文字。如果你已經改過，代表改過的檔案沒有傳到 GitHub 的 site 資料夾，或 Netlify 還沒有重新發佈。"); return; }
  if(!API){ add("bad","SHEET_API 的格式不對","目前的內容是「"+SHEET+"」，應該是 https:// 開頭的網址。"); return; }
  if(/\/dev(\?|$)/.test(SHEET)) add("bad","SHEET_API 是測試用網址","結尾是 /dev 的網址只有你自己登入時能用。請改用「部署 → 管理部署作業」裡結尾是 /exec 的網址。");
  else if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec$/.test(SHEET)) add("warn","SHEET_API 看起來不像 Apps Script 的網址","目前的內容是「"+SHEET+"」。正確的樣子是 https://script.google.com/macros/s/一長串代碼/exec");
  else add("ok","SHEET_API 的格式正確");
  // 3 連線
  let j=null, text="";
  try{ const r=await fetch(API+"?action=ping",{signal:timeout(20000)}); text=await r.text(); j=JSON.parse(text); }
  catch(e){ add("bad","連不上後端", text ? "後端回傳的不是資料，而是一個網頁。通常是部署時「誰可以存取」沒有選「所有人」，或這個網址不是網頁應用程式的網址。"
      : "瀏覽器無法取得回應。最常見的原因是部署時「誰可以存取」沒有選「所有人」（選成「只有我自己」或「擁有 Google 帳戶的任何人」都不行），其次是網址貼錯。"); return; }
  if(!j || j.service!=="phonics-gate"){ add("bad","後端是舊版的程式","連得上，但後端沒有回報版本，代表正在執行的不是最新的 Code.gs。請把新版 Code.gs 貼上、儲存，再到「部署 → 管理部署作業 → 編輯 → 版本選『新版本』→ 部署」。只按儲存不會生效；另外按「新增部署作業」會產生一個新的網址，舊網址仍然執行舊程式。"); return; }
  add("ok","後端連線正常","後端版本："+j.version);
  // 4 SITE_URL
  if(!j.site_url_ok) add("bad","後端的 SITE_URL 還沒有填好","請在 Apps Script 把 Code.gs 最上面的 SITE_URL 改成這個網站的網址，儲存後以「新版本」重新部署。現在按「送出報名」會出現「報名系統還沒有完成設定」。");
  else { const here=location.origin+location.pathname.replace(/[^\/]*$/,"");   // 信裡的連結指向網站根目錄，首頁會轉到測驗頁
    if(j.site_url===here) add("ok","後端的 SITE_URL 正確", j.site_url);
    else add("warn","後端的 SITE_URL 和現在這個網址不同","信裡的連結會連到 "+j.site_url+"，而你現在開的是 "+here+"。如果前者是你的正式網域，可以忽略；否則請修正 SITE_URL。"); }
  // 5 其他設定
  add(CFG.REGISTRATION_OPEN===true?"ok":"info", CFG.REGISTRATION_OPEN===true?"報名已開放":"報名尚未開放", CFG.REGISTRATION_OPEN===true?null:"首頁只會顯示「測驗即將開放報名」。自己測試時，在網址後面加上 ?preview=1 就能看到表單。");
  add(j.admin?"ok":"info", j.admin?"老師檢閱頁已開啟":"老師檢閱頁尚未開啟", j.admin?"網址：網站網址/teacher.html":"在 Code.gs 設定 ADMIN_PASSWORD，並以「新版本」重新部署。");
  add(CFG.BOOKING_URL?"ok":"info", CFG.BOOKING_URL?"預約諮詢按鈕已設定":"沒有設定預約諮詢網址", CFG.BOOKING_URL||"結果頁不會顯示預約諮詢按鈕。");
  add(CFG.ALLOW_INCOMPLETE_ASSETS===true?"warn":"ok", CFG.ALLOW_INCOMPLETE_ASSETS===true?"允許素材不齊時作答（測試用）":"素材不齊時不能作答", CFG.ALLOW_INCOMPLETE_ASSETS===true?"正式開放前請改回 false。":null);
  // 6 素材
  const imgs=requiredImages(), auds=requiredAudio(); let mi=0, ma=0;
  await pool(imgs, 8, async f=>{ if(!(await probeImage(f))) mi++; }, ()=>{});
  await pool(auds, 8, async k=>{ try{ const r=await fetch(CFG.audioDir+k+".mp3",{method:"HEAD"}); if(!r.ok||/text\/html/.test(r.headers.get("content-type")||"")) ma++; }catch(e){ ma++; } }, ()=>{});
  if(ma<auds.length){ const AC=window.AudioContext||window.webkitAudioContext, ctx2=new AC(), bad=[];
    for(const k of auds){ try{ const r=await fetch(CFG.audioDir+k+".mp3"); if(!r.ok||/text\/html/.test(r.headers.get("content-type")||"")) continue;
        const buf=await ctx2.decodeAudioData(await r.arrayBuffer()), d=buf.getChannelData(0); let peak=0; for(let i=0;i<d.length;i++){ const v=Math.abs(d[i]); if(v>peak) peak=v; }
        if(peak<0.02||buf.duration<0.25) bad.push(k+".mp3"); }catch(e){ bad.push(k+".mp3（無法解碼）"); } }
    add(bad.length?"bad":"ok", bad.length?`有 ${bad.length} 個錄音幾乎沒有聲音或太短`:"錄音都有聲音", bad.length?bad.join("、")+"。請用 make_audio.py --only 重做這些檔案。":null); }
  add(mi||ma?"info":"ok", mi||ma?"素材還沒有齊全":"素材齊全", `圖片 ${imgs.length-mi} / ${imgs.length}，錄音 ${auds.length-ma} / ${auds.length}。`+(mi||ma?"齊全之前，家長點連結會看到「測驗還在準備中」。":""));
  list.dataset.done="1";
}
function start(){ if(qs.get("check")==="1") checkScreen(); else if(TOKEN_Q) openToken(TOKEN_Q); else landing(); }
start();
})();
